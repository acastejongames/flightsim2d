name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [arena/01a1074e-flightsim2d]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract simulator
        run: |
          mkdir -p site
          if [ -f "realistic-2d-flight-simulator.zip" ]; then
            unzip -o realistic-2d-flight-simulator.zip -d site/
          fi
          # Si dentro del zip había una carpeta intermedia, mueve su contenido a site/
          if [ -d site/dist ]; then
            cp -r site/dist/* site/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
